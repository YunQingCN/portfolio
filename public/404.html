<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>五心集团</title>
  <script>
    // GitHub Pages SPA routing fix
    var path = window.location.pathname;
    if (path !== '/' && path !== '/index.html') {
      sessionStorage.setItem('redirect_path', path);
      window.location.href = './';
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
