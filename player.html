<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 影音播放器 - 网页版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0c29;
            color: #e0e0e0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* 顶部栏 */
        .top-bar {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 12px;
            flex-shrink: 0;
        }
        .top-bar .title {
            font-size: 16px;
            font-weight: bold;
            color: #a78bfa;
            padding: 4px 8px;
        }
        .top-bar .spacer { flex: 1; }
        .top-bar button {
            background: rgba(124,58,237,0.2);
            color: #a78bfa;
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .top-bar button:hover { background: rgba(124,58,237,0.35); }
        .top-bar .url-btn {
            background: rgba(6,182,212,0.15);
            color: #22d3ee;
            border-color: rgba(6,182,212,0.25);
        }
        .top-bar .url-btn:hover { background: rgba(6,182,212,0.3); }
        .top-bar .list-btn {
            background: rgba(255,255,255,0.06);
            color: #aaa;
            border: none;
        }
        .top-bar .list-btn:hover { background: rgba(255,255,255,0.12); color: #ddd; }

        /* 中间区域 */
        .center {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 频谱可视化 */
        .visualizer {
            width: 120px;
            min-width: 80px;
            max-width: 150px;
            flex-shrink: 0;
            background: rgba(0,0,0,0.3);
        }
        .visualizer canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 视频区域 */
        .video-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            min-width: 0;
        }
        .video-area video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .video-area .placeholder {
            position: absolute;
            color: #444;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }
        .video-area .placeholder .icon { font-size: 48px; margin-bottom: 12px; }

        /* 播放列表面板 */
        .playlist-panel {
            width: 0;
            overflow: hidden;
            background: rgba(10,10,26,0.95);
            transition: width 0.3s ease;
            flex-shrink: 0;
        }
        .playlist-panel.open { width: 260px; }
        .playlist-panel .pl-header {
            padding: 12px 16px;
            font-size: 13px;
            color: #888;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .playlist-panel ul {
            list-style: none;
            overflow-y: auto;
            height: calc(100% - 44px);
        }
        .playlist-panel li {
            padding: 10px 16px;
            font-size: 12px;
            color: #ccc;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-panel li:hover { background: rgba(255,255,255,0.05); }
        .playlist-panel li.active { background: rgba(124,58,237,0.2); color: #a78bfa; }

        /* 底部控制栏 */
        .controls {
            background: rgba(0,0,0,0.4);
            padding: 10px 20px 14px;
            flex-shrink: 0;
        }
        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .progress-row .time {
            font-size: 11px;
            color: #888;
            min-width: 40px;
            text-align: center;
        }
        .progress-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .progress-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px;
            background: #a78bfa;
            border-radius: 6px;
            cursor: pointer;
        }
        .progress-row input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
        }

        .btn-row {
            display: flex;
            align-items: center;
        }
        .btn-row .spacer { flex: 1; }
        .btn-row button {
            background: transparent;
            border: none;
            color: #ccc;
            cursor: pointer;
            transition: color 0.15s;
            font-size: 14px;
        }
        .btn-row button:hover { color: #fff; }
        .btn-row .ctrl-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-row .play-btn {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            border-radius: 50%;
            font-size: 18px;
            color: #fff;
            margin: 0 8px;
        }
        .btn-row .play-btn:hover {
            background: linear-gradient(135deg, #6d28d9, #2563eb);
            color: #fff;
        }

        /* 音量 */
        .vol-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .vol-group input[type="range"] {
            width: 80px;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .vol-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            background: #a78bfa;
            border-radius: 5px;
            cursor: pointer;
        }

        /* URL 对话框 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #1a1a3e;
            border-radius: 12px;
            padding: 24px;
            width: 520px;
            max-width: 90vw;
        }
        .modal h3 { color: #ccc; font-size: 15px; margin-bottom: 16px; }
        .modal input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.06);
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            outline: none;
            margin-bottom: 12px;
        }
        .modal input[type="text"]:focus { border-color: #7c3aed; }
        .modal .hint { color: #666; font-size: 11px; margin-bottom: 16px; }
        .modal .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal .modal-btns button {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }
        .modal .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            color: white;
        }
        .modal .btn-primary:hover { background: linear-gradient(135deg, #6d28d9, #2563eb); }
        .modal .btn-cancel {
            background: rgba(255,255,255,0.05);
            color: #888;
        }
        .modal .btn-cancel:hover { background: rgba(255,255,255,0.1); color: #bbb; }
    </style>
</head>
<body>
    <!-- 顶部栏 -->
    <div class="top-bar">
        <span class="title">🎬 影音播放器</span>
        <div class="spacer"></div>
        <button class="url-btn" onclick="showUrlModal()">🔗 源地址</button>
        <button onclick="addFiles()">+ 添加文件</button>
        <button class="list-btn" onclick="togglePlaylist()">☰ 列表</button>
    </div>

    <!-- 中间区域 -->
    <div class="center">
        <!-- 左频谱 -->
        <div class="visualizer"><canvas id="vizLeft"></canvas></div>

        <!-- 视频 -->
        <div class="video-area" id="videoArea">
            <video id="video" crossorigin="anonymous"></video>
            <div class="placeholder" id="placeholder">
                <div class="icon">🎬</div>
                <div>添加文件或输入URL开始播放</div>
            </div>
        </div>

        <!-- 右频谱 -->
        <div class="visualizer"><canvas id="vizRight"></canvas></div>

        <!-- 播放列表 -->
        <div class="playlist-panel" id="playlistPanel">
            <div class="pl-header">播放列表</div>
            <ul id="playlistUl"></ul>
        </div>
    </div>

    <!-- 底部控制 -->
    <div class="controls">
        <div class="progress-row">
            <span class="time" id="timeCur">0:00</span>
            <input type="range" id="progress" min="0" max="1000" value="0">
            <span class="time" id="timeDur">0:00</span>
        </div>
        <div class="btn-row">
            <div class="vol-group">
                <button onclick="toggleMute()" id="volBtn">🔊</button>
                <input type="range" id="volSlider" min="0" max="100" value="70">
            </div>
            <div class="spacer"></div>
            <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
            <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
            <div class="spacer"></div>
            <button class="ctrl-btn" id="loopBtn" onclick="cycleLoop()">🔁</button>
        </div>
    </div>

    <!-- URL 对话框 -->
    <div class="modal-overlay" id="urlModal">
        <div class="modal">
            <h3>🔗 源地址播放</h3>
            <input type="text" id="urlInput" placeholder="粘贴媒体链接，如：https://...mp4 或 https://...m3u8">
            <div class="hint">支持直链媒体文件（MP4/M3U8/MP3等），网页视频暂不支持解析</div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="hideUrlModal()">取消</button>
                <button class="btn-primary" onclick="playUrl()">▶ 播放</button>
            </div>
        </div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="fileInput" multiple accept="video/*,audio/*" style="display:none">

    <script>
        // ─── 状态 ───
        const video = document.getElementById('video');
        const progress = document.getElementById('progress');
        const timeCur = document.getElementById('timeCur');
        const timeDur = document.getElementById('timeDur');
        const playBtn = document.getElementById('playBtn');
        const volSlider = document.getElementById('volSlider');
        const volBtn = document.getElementById('volBtn');
        const loopBtn = document.getElementById('loopBtn');
        const playlistUl = document.getElementById('playlistUl');
        const playlistPanel = document.getElementById('playlistPanel');
        const placeholder = document.getElementById('placeholder');
        const fileInput = document.getElementById('fileInput');

        let playlist = []; // [{url, name, isAudio, isLocal}]
        let currentIndex = -1;
        let isPlaying = false;
        let loopMode = 0; // 0=顺序, 1=列表循环, 2=单曲循环

        // ─── Web Audio API 频谱 ───
        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;
        let freqData = null;
        let barsLeft = new Array(18).fill(0);
        let barsRight = new Array(18).fill(0);
        let targetLeft = new Array(18).fill(0);
        let targetRight = new Array(18).fill(0);

        function initAudioContext() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.8;
            freqData = new Uint8Array(analyser.frequencyBinCount);
            try {
                sourceNode = audioCtx.createMediaElementSource(video);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
            } catch(e) {
                console.warn('Audio context setup failed:', e);
            }
        }

        // ─── 频谱绘制 ───
        const canvasL = document.getElementById('vizLeft');
        const canvasR = document.getElementById('vizRight');
        const ctxL = canvasL.getContext('2d');
        const ctxR = canvasR.getContext('2d');

        function resizeCanvases() {
            [canvasL, canvasR].forEach(c => {
                c.width = c.parentElement.clientWidth;
                c.height = c.parentElement.clientHeight;
            });
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        function drawBars(ctx, bars, mirror) {
            const w = ctx.canvas.width;
            const h = ctx.canvas.height;
            ctx.clearRect(0, 0, w, h);

            const count = bars.length;
            const gap = 3;
            const barW = Math.max(3, (w - (count + 1) * gap) / count);
            const totalGap = (w - barW * count) / (count + 1);

            for (let i = 0; i < count; i++) {
                // 平滑过渡
                bars[i] += (getTarget(i, mirror) - bars[i]) * 0.3;
                const barH = Math.max(2, bars[i] * (h - 20));
                const x = totalGap + i * (barW + totalGap);
                const y = h - barH - 4;

                const gradient = ctx.createLinearGradient(x, y + barH, x, y);
                if (mirror) {
                    gradient.addColorStop(0, 'rgb(6, 182, 212)');
                    gradient.addColorStop(0.5, 'rgb(59, 130, 246)');
                    gradient.addColorStop(1, 'rgb(124, 58, 237)');
                } else {
                    gradient.addColorStop(0, 'rgb(124, 58, 237)');
                    gradient.addColorStop(0.5, 'rgb(59, 130, 246)');
                    gradient.addColorStop(1, 'rgb(6, 182, 212)');
                }

                ctx.fillStyle = gradient;
                ctx.globalAlpha = 0.9;
                ctx.beginPath();
                ctx.roundRect(Math.floor(x), Math.floor(y), barW, Math.floor(barH), 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function getTarget(index, mirror) {
            if (!freqData || !analyser) return 0;
            const binCount = analyser.frequencyBinCount;
            const idx = Math.floor(index / 18 * binCount * 0.6);
            return (freqData[idx] || 0) / 255;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (analyser && isPlaying) {
                analyser.getByteFrequencyData(freqData);
            }

            drawBars(ctxL, barsLeft, false);
            drawBars(ctxR, barsRight, true);
        }
        animate();

        // ─── 文件操作 ───
        fileInput.addEventListener('change', (e) => {
            for (const file of e.target.files) {
                const url = URL.createObjectURL(file);
                const isAudio = file.type.startsWith('audio');
                playlist.push({ url, name: file.name, isAudio, isLocal: true });
                addPlaylistItem(playlist.length - 1);
            }
            if (currentIndex === -1 && playlist.length > 0) loadTrack(0);
            fileInput.value = '';
        });

        function addFiles() {
            fileInput.click();
        }

        function addPlaylistItem(idx) {
            const item = playlist[idx];
            const li = document.createElement('li');
            const icon = item.isAudio ? '🎵' : (item.isLocal ? '🎬' : '🌐');
            li.textContent = `${icon} ${item.name}`;
            li.dataset.idx = idx;
            li.onclick = () => { loadTrack(idx); play(); };
            playlistUl.appendChild(li);
        }

        // ─── 播放控制 ───
        function loadTrack(idx) {
            if (idx < 0 || idx >= playlist.length) return;
            currentIndex = idx;
            video.src = playlist[idx].url;
            video.load();
            placeholder.style.display = 'none';

            // 高亮
            playlistUl.querySelectorAll('li').forEach((li, i) => {
                li.classList.toggle('active', i === idx);
            });
        }

        function togglePlay() {
            if (currentIndex === -1 && playlist.length > 0) loadTrack(0);
            if (video.paused) {
                play();
            } else {
                video.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            }
        }

        function play() {
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            video.play();
            isPlaying = true;
            playBtn.textContent = '⏸';
        }

        video.addEventListener('play', () => { isPlaying = true; playBtn.textContent = '⏸'; });
        video.addEventListener('pause', () => { isPlaying = false; playBtn.textContent = '▶'; });

        video.addEventListener('ended', () => {
            if (loopMode === 2) { // 单曲循环
                video.currentTime = 0;
                video.play();
            } else {
                nextTrack();
            }
        });

        function prevTrack() {
            if (!playlist.length) return;
            const idx = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(idx);
            if (isPlaying) play();
        }

        function nextTrack() {
            if (!playlist.length) return;
            if (loopMode === 1 && currentIndex === playlist.length - 1) { // 列表循环
                loadTrack(0);
            } else {
                const idx = (currentIndex + 1) % playlist.length;
                loadTrack(idx);
            }
            if (isPlaying) play();
        }

        function toggleMute() {
            video.muted = !video.muted;
            volBtn.textContent = video.muted ? '🔇' : '🔊';
        }

        function cycleLoop() {
            loopMode = (loopMode + 1) % 3;
            const labels = ['🔁', '🔁', '🔂'];
            loopBtn.textContent = labels[loopMode];
        }

        // ─── 进度条 ───
        video.addEventListener('timeupdate', () => {
            if (video.duration > 0) {
                progress.value = Math.floor(video.currentTime / video.duration * 1000);
                timeCur.textContent = fmtTime(video.currentTime * 1000);
                timeDur.textContent = fmtTime(video.duration * 1000);
            }
        });

        progress.addEventListener('input', () => {
            if (video.duration > 0) {
                video.currentTime = progress.value / 1000 * video.duration;
            }
        });

        // ─── 音量 ───
        volSlider.addEventListener('input', () => {
            video.volume = volSlider.value / 100;
        });
        video.volume = 0.7;

        // ─── 播放列表切换 ───
        function togglePlaylist() {
            playlistPanel.classList.toggle('open');
            setTimeout(resizeCanvases, 350);
        }

        // ─── URL 对话框 ───
        function showUrlModal() {
            document.getElementById('urlModal').classList.add('show');
            document.getElementById('urlInput').focus();
        }
        function hideUrlModal() {
            document.getElementById('urlModal').classList.remove('show');
        }
        function playUrl() {
            let url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://') &&
                !url.startsWith('rtsp://') && !url.startsWith('rtmp://')) {
                url = 'https://' + url;
            }
            const name = url.length > 50 ? url.substring(0, 47) + '...' : url;
            playlist.push({ url, name, isAudio: false, isLocal: false });
            addPlaylistItem(playlist.length - 1);
            if (currentIndex === -1) loadTrack(0);
            hideUrlModal();
            document.getElementById('urlInput').value = '';
            play();
        }
        document.getElementById('urlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') playUrl();
        });

        // ─── 拖放 ───
        const videoArea = document.getElementById('videoArea');
        videoArea.addEventListener('dragover', (e) => { e.preventDefault(); });
        videoArea.addEventListener('drop', (e) => {
            e.preventDefault();
            for (const file of e.dataTransfer.files) {
                if (file.type.startsWith('video') || file.type.startsWith('audio')) {
                    const url = URL.createObjectURL(file);
                    const isAudio = file.type.startsWith('audio');
                    playlist.push({ url, name: file.name, isAudio, isLocal: true });
                    addPlaylistItem(playlist.length - 1);
                }
            }
            if (currentIndex === -1 && playlist.length > 0) loadTrack(0);
        });

        // ─── 键盘快捷键 ───
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowLeft':
                    video.currentTime = Math.max(0, video.currentTime - 5);
                    break;
                case 'ArrowRight':
                    video.currentTime = Math.min(video.duration, video.currentTime + 5);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    volSlider.value = Math.min(100, parseInt(volSlider.value) + 5);
                    video.volume = volSlider.value / 100;
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    volSlider.value = Math.max(0, parseInt(volSlider.value) - 5);
                    video.volume = volSlider.value / 100;
                    break;
            }
        });

        // ─── 工具函数 ───
        function fmtTime(ms) {
            const s = Math.floor(ms / 1000);
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
